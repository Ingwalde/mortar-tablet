# Desktop builds for macOS and Linux (Windows is built locally: npm run dist:win).
# Run: manually (Actions -> Desktop -> Run workflow). Without a tag the result stays a build artifact; with a tag the files
# are attached to that release. The builds are not signed (macOS warns about an unknown developer).
name: Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the files to (empty: build artifact only)"
        required: false
      only:
        description: "With a tag: attach only this build (mac-arm64, mac-x64, linux-x64); empty: all of them"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runners are often unavailable ("capacity constraints", the job is cancelled before it starts),
          # so the arm64 app is built on the Intel runner with the arm64 native libraries swapped in.
          - name: mac-arm64
            os: macos-15-intel
            args: --mac dmg --arm64
            cpu: arm64
            files: "dist/*.dmg"
          - name: mac-x64
            os: macos-15-intel
            args: --mac dmg --x64
            files: "dist/*.dmg"
          - name: linux-x64
            os: ubuntu-latest
            args: --linux AppImage deb --x64
            files: |
              dist/MortarTablet-*-linux-*
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run licenses:collect
      - run: npx electron-vite build
      - name: Native libraries for the target CPU
        if: ${{ matrix.cpu != '' }}
        shell: bash
        run: |
          set -e
          npm install --no-save --force --os=darwin --cpu=${{ matrix.cpu }} sharp@$(node -p "require('sharp/package.json').version")
          rm -rf node_modules/@img/sharp-darwin-x64 node_modules/@img/sharp-libvips-darwin-x64
          ls node_modules/@img
          test -d node_modules/@img/sharp-darwin-${{ matrix.cpu }}
          test -d node_modules/@img/sharp-libvips-darwin-${{ matrix.cpu }}
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Package contents
        shell: bash
        run: ls -la dist
      - name: Check legal files and the libvips library
        shell: bash
        run: |
          set -e
          found=0
          for res in dist/mac*/*.app/Contents/Resources dist/linux-unpacked/resources; do
            [ -d "$res" ] || continue
            found=1
            for f in legal/APPLICATION-LICENSE.txt legal/THIRD-PARTY-NOTICES.md legal/npm-notices.txt legal/native/SOURCE-OFFER.md legal/native/REBUILD-LIBVIPS.md legal/native/component-licenses/INDEX.md; do
              test -f "$res/$f" || { echo "$res is missing $f"; exit 1; }
            done
            n=$(ls "$res/legal/native/component-licenses" | wc -l)
            echo "$res: component license files: $n"
            ls "$res"/app.asar.unpacked/node_modules/@img/sharp-libvips-*/lib | grep -E "libvips-cpp" || { echo "$res has no libvips outside app.asar"; exit 1; }
          done
          [ "$found" = 1 ] || { echo "No unpacked application found in dist"; exit 1; }
          echo "Electron licenses in the build:"
          els=$(find dist -name "LICENSE.electron.txt" -o -name "LICENSES.chromium.html" | wc -l)
          echo "Electron/Chromium license files: $els"
          [ "$els" -ge 2 ] || { echo "Electron/Chromium licenses are missing"; exit 1; }
      - name: Check the packaged libraries are for the target CPU
        if: ${{ matrix.cpu != '' }}
        shell: bash
        run: |
          set -e
          res=$(ls -d dist/mac*/*.app/Contents/Resources | head -1)
          unpacked="$res/app.asar.unpacked/node_modules/@img"
          ls "$unpacked"
          test -d "$unpacked/sharp-libvips-darwin-${{ matrix.cpu }}"
          ! ls "$unpacked" | grep -q "darwin-x64"
          file "$res"/../MacOS/* "$unpacked"/sharp-darwin-${{ matrix.cpu }}/lib/*.node
          file "$res"/../MacOS/* "$unpacked"/sharp-darwin-${{ matrix.cpu }}/lib/*.node | grep -c "${{ matrix.cpu }}" | grep -qv "^0$"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to the release
        if: ${{ inputs.tag != '' && (inputs.only == '' || inputs.only == matrix.name) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FILES: ${{ matrix.files }}
        run: gh release upload "$TAG" $FILES --clobber
